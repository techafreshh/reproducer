name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Python venv sanity
        run: python3 -m venv --help && python3 -m pip --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test
        env:
          PYPI_LIVE: "0"

      - name: Compose config
        run: docker compose config || docker-compose config

      - name: Vitest gate suites
        run: bunx vitest run src/gate src/sanitize

      - name: Build
        run: npm run build

      - name: Healthz smoke
        run: |
          npm start &
          for i in $(seq 1 30); do
            body=$(curl -sf http://localhost:8080/healthz || true)
            if [ "$body" = '{"ok":true}' ]; then
              echo "healthz OK: $body"
              runs=$(curl -sf http://localhost:8080/api/runs)
              if [ "$runs" != "[]" ]; then
                echo "GET /api/runs expected [], got: $runs"
                kill %1
                exit 1
              fi
              unknown_run=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/runs/999)
              if [ "$unknown_run" != "404" ]; then
                echo "GET /api/runs/999 expected 404, got: $unknown_run"
                kill %1
                exit 1
              fi
              bad_json=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://localhost:8080/api/runs/1 -H 'content-type: application/json' --data '{bad json')
              if [ "$bad_json" != "400" ]; then
                echo "PUT /api/runs/1 with malformed body expected 400, got: $bad_json"
                kill %1
                exit 1
              fi
              echo "api smoke OK"
              kill %1
              exit 0
            fi
            sleep 1
          done
          echo "healthz probe failed"
          kill %1
          exit 1
