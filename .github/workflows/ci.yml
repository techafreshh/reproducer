name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Healthz smoke
        run: |
          npm start &
          for i in $(seq 1 30); do
            body=$(curl -sf http://localhost:8080/healthz || true)
            if [ "$body" = '{"ok":true}' ]; then
              echo "healthz OK: $body"
              kill %1
              exit 0
            fi
            sleep 1
          done
          echo "healthz probe failed"
          kill %1
          exit 1
